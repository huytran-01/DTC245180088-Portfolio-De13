# Cau hinh Nginx Reverse Proxy - DTC245180088 (De 13)
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tat thong tin phien ban Nginx tren Header de tang bao mat
    server_tokens off;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Cau hinh Upstream toi ung dung Apache/PHP
    upstream backend_portfolio {
        server portfolio_app:8080;
    }

    # 1. HTTP Server - Cong 80: Chuyen huong ve HTTPS 443
    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        # Chuyen huong 301 sang HTTPS
        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Server - Cong 443: Reverse Proxy toi portfolio_app:8080
    server {
        listen 443 ssl;
        server_name localhost;
        server_tokens off;

        # Chung chi SSL tu ky
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Cac Security Headers bat buoc
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Chuyen tiep yeu cau ve backend Apache PHP 8.2
        location / {
            proxy_pass http://backend_portfolio;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }

    # 3. Server noi bo - Cong 8081: Mo endpoint /stub_status cho Prometheus giam sat
    server {
        listen 8081;
        server_name localhost;
        server_tokens off;

        location /stub_status {
            stub_status;
            access_log off;
            allow all;
        }

        location / {
            return 404 "Not Found. Use /stub_status";
        }
    }
}
