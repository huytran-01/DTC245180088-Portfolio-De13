# Promtail Configuration - DTC245180088 (De 13)
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thap log cua Docker Containers
  - job_name: docker_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: container_logs
          __path__: /var/lib/docker/containers/*/*-json.log

  # 2. Thu thap log Nginx Access & Error
  - job_name: nginx_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_access_error
          __path__: /var/log/nginx/*.log
