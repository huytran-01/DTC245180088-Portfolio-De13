version: '3.8'

services:
  # ==============================================================================
  # TẦNG CƠ SỞ DỮ LIỆU & BẢO MẬT (MySQL 8.0)
  # ==============================================================================
  mysql_db:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # TẦNG ỨNG DỤNG WEB (PHP 8.2 + Apache Non-Root Port 8080)
  # ==============================================================================
  portfolio_app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 256M
    env_file:
      - .env
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - portfolio_network

  # ==============================================================================
  # TẦNG REVERSE PROXY & SSL (Nginx)
  # ==============================================================================
  nginx_proxy:
    image: nginx:alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - portfolio_app
    networks:
      - portfolio_network

  # ==============================================================================
  # TẦNG GIÁM SÁT METRICS (Prometheus & Grafana & Exporters)
  # ==============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: portfolio_prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - portfolio_network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: portfolio_grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Admin@DTC245180088
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./prometheus/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - portfolio_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: portfolio_cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - portfolio_network

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.0.0
    container_name: portfolio_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx_proxy:8081/stub_status
    depends_on:
      - nginx_proxy
    networks:
      - portfolio_network

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: portfolio_mysqld_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER}:${MYSQL_PASSWORD}@(mysql_db:3306)/${MYSQL_DATABASE}"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - portfolio_network

  # ==============================================================================
  # TẦNG THU THẬP VÀ PHÂN TÍCH LOG TẬP TRUNG (Loki & Promtail)
  # ==============================================================================
  loki:
    image: grafana/loki:2.9.2
    container_name: portfolio_loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - portfolio_network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: portfolio_promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      - loki
    networks:
      - portfolio_network

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  portfolio_network:
    name: portfolio_net
    driver: bridge

volumes:
  mysql_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:
